name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: openssl, curl
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run unit tests
        run: composer test:unit

      - name: Run integration tests
        run: composer test:integration

  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl, curl
          coverage: none

      - name: Start Pebble
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run E2E tests
        env:
          PEBBLE_URL: https://localhost:14000/dir
          CHALLTESTSRV_URL: http://127.0.0.1:8055
          PEBBLE_DOMAIN: localhost
        run: composer test:e2e

      - name: Stop Pebble
        if: always()
        run: docker compose -f docker-compose.test.yml down
